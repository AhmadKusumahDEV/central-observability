# Observability ingress for the existing Cloudflare Tunnel.
#
# Public TLS ends at Cloudflare. cloudflared forwards to nginx-proxy:8080
# inside tunnel-net. This container must not publish 80, 443, 8080, 4317,
# or 4318 to the host.

map $http_cf_connecting_ip $obs_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_upgrade $obs_connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone $obs_client_ip zone=obs_ui_rl:10m rate=30r/s;
limit_req_zone $obs_client_ip zone=obs_login_rl:10m rate=5r/m;
limit_req_zone $obs_client_ip zone=obs_otlp_rl:10m rate=20r/s;
limit_conn_zone $obs_client_ip zone=obs_conn:10m;

log_format obs_safe escape=json
  '{"ts":"$time_iso8601","rid":"$request_id","ip":"$obs_client_ip",'
  '"method":"$request_method","uri":"$uri","proto":"$server_protocol",'
  '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"upstream":"$upstream_addr","ustatus":"$upstream_status",'
  '"urt":"$upstream_response_time","cf_ray":"$http_cf_ray"}';

# Reject an unknown Host before it can reach any application server block.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

# Grafana UI. Cloudflare Access should be the outer authentication layer.
server {
    listen 8080;
    server_name observability.madgo.my.id;

    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana_upstream http://grafana:3000;

    client_max_body_size 16m;
    client_body_timeout 60s;
    send_timeout 30s;
    limit_conn obs_conn 100;
    limit_conn_status 429;

    access_log /var/log/nginx/access.log obs_safe;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_hide_header X-Powered-By;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /metrics { return 404; }
    location = /api/health { return 404; }
    location ^~ /api/live/push/ { return 404; }

    location = /login {
        limit_req zone=obs_login_rl burst=3 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $obs_client_ip;
        proxy_set_header X-Forwarded-For $obs_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_pass $grafana_upstream;
    }

    location ^~ /api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obs_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $obs_client_ip;
        proxy_set_header X-Forwarded-For $obs_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header Cf-Access-Authenticated-User-Email "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass $grafana_upstream;
    }

    location / {
        limit_req zone=obs_ui_rl burst=100 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $obs_client_ip;
        proxy_set_header X-Forwarded-For $obs_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 110s;
        proxy_pass $grafana_upstream;
    }
}

# OTLP/HTTP for remote applications. gRPC stays private; the existing
# Cloudflare Tunnel public hostname does not support gRPC.
server {
    listen 8080;
    server_name otlp.madgo.my.id;

    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $otel_http http://otel-collector:4318;

    client_max_body_size 8m;
    client_body_timeout 60s;
    send_timeout 30s;
    limit_conn obs_conn 20;
    limit_conn_status 429;

    access_log /var/log/nginx/access.log obs_safe;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_hide_header X-Powered-By;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/v1/(traces|metrics|logs)$ {
        limit_except POST { deny all; }
        limit_req zone=obs_otlp_rl burst=40 nodelay;
        limit_req_status 429;

        auth_basic "OTLP ingestion";
        auth_basic_user_file /etc/nginx/secrets/otlp.htpasswd;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $obs_client_ip;
        proxy_set_header X-Forwarded-For $obs_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Connection "";

        proxy_pass $otel_http;
    }

    location / { return 404; }
}
