# Production overlay for the VPS.
#
# Usage:
#   docker compose -f compose.yaml -f deploy/compose.prod.yml up -d
#
# The observability-ingress network carries only Nginx -> Grafana and
# Nginx -> OTLP HTTP. Grafana and the Collector are not attached to the
# applications' monitoring network unless already declared in compose.yaml.

services:
  otel-collector:
    mem_limit: 512m
    stop_grace_period: 30s
    networks:
      monitoring:
      observability:
      observability-ingress:
    environment:
      GOMEMLIMIT: 460MiB

  grafana:
    mem_limit: 512m
    stop_grace_period: 30s
    networks:
      observability:
      observability-ingress:
    environment:
      GF_SERVER_DOMAIN: observability.madgo.my.id
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax

  prometheus:
    mem_limit: 768m
    stop_grace_period: 60s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage

  loki:
    mem_limit: 768m
    stop_grace_period: 60s

  tempo:
    mem_limit: 768m
    stop_grace_period: 60s

  alertmanager:
    mem_limit: 128m
    stop_grace_period: 30s

networks:
  observability-ingress:
    external: true
    name: observability-ingress
