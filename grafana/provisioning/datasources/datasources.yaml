apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-main
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo-main
          urlDisplayLabel: View trace

  - name: Loki
    type: loki
    uid: loki-main
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo-main
          urlDisplayLabel: Open trace

  - name: Tempo
    type: tempo
    uid: tempo-main
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-main
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus-main
        tags:
          - key: service.name
            value: service_name
      lokiSearch:
        datasourceUid: loki-main
      search:
        hide: false

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager-main
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus

