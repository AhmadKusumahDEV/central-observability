name: central-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:13133:13133"
    networks:
      - monitoring
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - observability

  loki:
    image: grafana/loki:3.6.16
    command: ["-config.file=/etc/loki/loki.yaml"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - observability
      - egress
    secrets:
      - telegram_bot_token
      - telegram_chat_id

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - observability
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo-app:
    profiles: ["demo"]
    build:
      context: ./examples/go-demo-app
    image: central-observability-demo:0.1.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: go-demo
      DEPLOYMENT_ENVIRONMENT: dev
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,service.namespace=observability-demo,service.version=0.1.0
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - monitoring
    depends_on:
      - otel-collector

  caddy:
    profiles: ["ingress"]
    image: caddy:2.11.7
    restart: unless-stopped
    logging: *default-logging
    environment:
      OTEL_DOMAIN: ${OTEL_DOMAIN:-otel.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      OTLP_BASIC_USER: ${OTLP_BASIC_USER:-otel-writer}
      OTLP_BASIC_HASH: ${OTLP_BASIC_HASH:-invalid-placeholder}
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - monitoring
    depends_on:
      - otel-collector

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring}
  observability:
    name: central-observability-internal
  egress:
    name: central-observability-egress

volumes:
  prometheus-data:
    name: central-observability-prometheus-data
  loki-data:
    name: central-observability-loki-data
  tempo-data:
    name: central-observability-tempo-data
  grafana-data:
    name: central-observability-grafana-data
  alertmanager-data:
    name: central-observability-alertmanager-data
  caddy-data:
    name: central-observability-caddy-data
  caddy-config:
    name: central-observability-caddy-config

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_chat_id:
    file: ./secrets/telegram_chat_id

